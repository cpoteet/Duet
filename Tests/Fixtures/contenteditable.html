<!doctype html>
<html><body>
<div contenteditable="true" role="textbox"></div>
<script>
// Like the providers, send on a trusted Return keypress.
const composer = document.querySelector('[contenteditable]');
composer.addEventListener('keydown', event => {
  if (event.key !== 'Enter' || event.shiftKey || !event.isTrusted) return;
  event.preventDefault();
  const message = document.createElement('div');
  message.dataset.testid = 'user-message';
  message.textContent = composer.innerText;
  document.body.appendChild(message);
  composer.textContent = '';
});
</script>
</body></html>
